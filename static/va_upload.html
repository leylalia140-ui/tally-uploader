<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Content Upload</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 24px; color: #1a1a1a; }
  h1 { font-size: 28px; margin-bottom: 40px; }
  label { display: block; font-weight: 600; margin: 28px 0 8px; font-size: 15px; }
  label .req { color: #888; font-weight: 400; }
  select, input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid #d5d5d5; border-radius: 8px; background: #fff; }
  select:focus, input:focus { outline: none; border-color: #6b8afd; box-shadow: 0 0 0 3px rgba(107,138,253,.15); }
  .hidden { display: none !important; }
  .drop {
    margin-top: 8px; border: 1.5px dashed #c9c9c9; border-radius: 10px; padding: 28px 16px;
    text-align: center; color: #777; cursor: pointer; font-size: 14px; position: relative;
  }
  .drop.dragover { border-color: #6b8afd; background: #f3f6ff; }
  .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .file-row { border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .file-row .row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .file-row .fname { font-weight: 600; color: #1a1a1a; word-break: break-all; font-size: 14px; }
  .file-row .remove { background: none; border: none; color: #999; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .file-row .remove:hover { color: #c0392b; }
  .bar-track { height: 6px; background: #eee; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
  .bar-fill { height: 100%; width: 0%; background: #4caf50; transition: width .2s; }
  .bar-label { font-size: 12px; color: #777; margin-top: 4px; display: none; }
  button#submit { margin-top: 36px; background: #1a1a1a; color: #fff; border: none; padding: 13px 26px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button#submit:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 20px; font-size: 14px; white-space: pre-line; }
  #status.error { color: #c0392b; }
  #status.ok { color: #2e7d32; }
</style>
</head>
<body>

<h1>VA Content Upload</h1>

<label>For Which Model are you uploading Content? <span class="req">*</span></label>
<select id="model">
  <option value=""></option>
  <option>Margaret Asian</option>
  <option>Abby Parker</option>
  <option>Yuki Chen</option>
  <option>Bertha Butts</option>
</select>

<div id="niche-margaret" class="hidden">
  <label>Margaret Niche</label>
  <select class="niche-select">
    <option value=""></option>
    <option>Snapchat Based Reels</option>
    <option>School Girl Reels</option>
    <option>Interview Reels</option>
    <option>Instagram FEED PICTURES</option>
    <option>GERMAN Schhol Girl Reels</option>
  </select>
</div>

<div id="niche-abby" class="hidden">
  <label>Abby Niche</label>
  <select class="niche-select">
    <option value=""></option>
    <option>Snapchat Based Reels</option>
    <option>School Girl Reels</option>
    <option>Interview Reels</option>
    <option>Instagram FEED PICTURES</option>
    <option>GERMAN School Girl Reels</option>
  </select>
</div>

<div id="niche-yuki" class="hidden">
  <label>Yuki Niche</label>
  <select class="niche-select">
    <option value=""></option>
    <option>Snapchat Based Reels</option>
    <option>School Girl Reels</option>
    <option>Interview Reels</option>
    <option>GERMAN School Girl Reels</option>
  </select>
</div>

<div id="niche-bertha" class="hidden">
  <label>Bertha Niche</label>
  <select class="niche-select">
    <option value=""></option>
    <option>Snapchat Based Reels</option>
    <option>School Girl Reels</option>
    <option>Interview Reels</option>
    <option>Instagram FEED PICTURES</option>
  </select>
</div>

<label>Who is uploading this? <span class="req">*</span></label>
<select id="va_name">
  <option value=""></option>
  <option>Ken</option>
  <option>James</option>
</select>

<label>What kind of Content? <span class="req">*</span></label>
<select id="content_type">
  <option value=""></option>
  <option>Instagram AI Reels</option>
  <option>Instagram Feed Pictures</option>
</select>

<label>Content Upload <span class="req">*</span></label>
<div class="drop" id="drop">
  <input type="file" id="file-input" multiple accept="video/*,image/*">
  <div class="drop-text">Click to choose files or drag here — select as many at once as you like</div>
</div>
<div id="file-list"></div>

<button id="submit" disabled>Upload</button>
<div id="status"></div>

<script>
const modelEl = document.getElementById("model");
const submitBtn = document.getElementById("submit");
const statusEl = document.getElementById("status");
const dropEl = document.getElementById("drop");
const fileInputEl = document.getElementById("file-input");
const fileListEl = document.getElementById("file-list");

// Selected files live here, independent of the <input> (which we clear after
// every pick so the same underlying browser dialog can add more on top of an
// existing selection instead of replacing it).
let selectedFiles = [];
// Indices already fully uploaded — if Upload is clicked again after a
// partial failure, these are skipped instead of being sent twice.
let completedIndices = new Set();
// Fixed once the first file's /init call returns, then reused for every
// other file AND for every retry — so a whole batch (including a retry
// after a partial failure) always lands in the same dated folder, even if
// a retry happens to straddle midnight.
const dateStrRef = { value: null };

const nicheBlocks = {
  "Margaret Asian": document.getElementById("niche-margaret"),
  "Abby Parker": document.getElementById("niche-abby"),
  "Yuki Chen": document.getElementById("niche-yuki"),
  "Bertha Butts": document.getElementById("niche-bertha"),
};

modelEl.addEventListener("change", () => {
  Object.values(nicheBlocks).forEach(el => el.classList.add("hidden"));
  const block = nicheBlocks[modelEl.value];
  if (block) block.classList.remove("hidden");
  validate();
});

function addFiles(fileList) {
  selectedFiles.push(...Array.from(fileList));
  renderFileList();
  validate();
}

function removeFile(index) {
  if (completedIndices.has(index)) return; // safety net, button is disabled anyway
  selectedFiles.splice(index, 1);
  // shift completed-index bookkeeping down past the removed item
  completedIndices = new Set(Array.from(completedIndices, i => (i > index ? i - 1 : i)));
  renderFileList();
  validate();
}

function renderFileList() {
  fileListEl.innerHTML = selectedFiles.map((f, i) => {
    const done = completedIndices.has(i);
    return `
    <div class="file-row" data-index="${i}">
      <div class="row-top">
        <span class="fname">${done ? "✅ " : ""}${f.name} <span style="color:#999;font-weight:400">(${(f.size / 1024 / 1024).toFixed(1)} MB)</span></span>
        <button type="button" class="remove" data-remove="${i}" ${done ? "disabled" : ""}>✕</button>
      </div>
      <div class="bar-track" style="${done ? "display:block" : ""}"><div class="bar-fill" style="${done ? "width:100%" : ""}"></div></div>
      <div class="bar-label" style="${done ? "display:block" : ""}">${done ? "100% — already uploaded" : ""}</div>
    </div>
  `;
  }).join("");
  fileListEl.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => removeFile(parseInt(btn.dataset.remove, 10)));
  });
}

fileInputEl.addEventListener("change", () => {
  if (fileInputEl.files.length) addFiles(fileInputEl.files);
  fileInputEl.value = ""; // allow picking more on top of the existing selection
});
dropEl.addEventListener("dragover", e => { e.preventDefault(); dropEl.classList.add("dragover"); });
dropEl.addEventListener("dragleave", () => dropEl.classList.remove("dragover"));
dropEl.addEventListener("drop", e => {
  e.preventDefault();
  dropEl.classList.remove("dragover");
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

function currentNiche() {
  const block = nicheBlocks[modelEl.value];
  if (!block) return "";
  return block.querySelector(".niche-select").value;
}

function validate() {
  const model = modelEl.value;
  const vaName = document.getElementById("va_name").value;
  const contentType = document.getElementById("content_type").value;
  const ok = model && vaName && contentType && selectedFiles.length > 0;
  submitBtn.disabled = !ok;
  return ok;
}
document.getElementById("va_name").addEventListener("change", validate);
document.getElementById("content_type").addEventListener("change", validate);

// ── Resumable upload to Google Drive (bytes go straight from this browser
// to Google — never through our own server) ──────────────────────────────
async function uploadResumable(uploadUrl, file, onProgress) {
  const chunkSize = 8 * 1024 * 1024; // 8 MiB
  let offset = 0;
  while (offset < file.size) {
    const end = Math.min(offset + chunkSize, file.size);
    const isFinalChunk = end === file.size;
    let attempt = 0;
    let advanced = false;
    while (!advanced) {
      try {
        const resp = await fetch(uploadUrl, {
          method: "PUT",
          headers: { "Content-Range": `bytes ${offset}-${end - 1}/${file.size}` },
          body: file.slice(offset, end),
        });
        if (resp.status === 200 || resp.status === 201) {
          onProgress(file.size, file.size);
          return await resp.json();
        }
        if (resp.status === 308) {
          onProgress(end, file.size);
          offset = end;
          advanced = true;
          break;
        }
        throw new Error("Unexpected status " + resp.status);
      } catch (err) {
        if (isFinalChunk) {
          // Google's resumable-upload completion response is missing CORS
          // headers for third-party browser origins (verified server-side:
          // the file is actually created even though the browser can't read
          // this particular response) — the upload itself succeeded, we just
          // can't read the file ID here. The backend will look the file up
          // by name in the destination folder instead.
          onProgress(file.size, file.size);
          return null;
        }
        attempt++;
        if (attempt > 6) throw err;
        // ask Google how many bytes it actually has, then resume from there
        try {
          const rangeResp = await fetch(uploadUrl, {
            method: "PUT",
            headers: { "Content-Range": `bytes */${file.size}` },
          });
          const range = rangeResp.headers.get("Range");
          if (range) offset = parseInt(range.split("-")[1], 10) + 1;
        } catch (e2) { /* network still down, just retry current offset */ }
        await new Promise(r => setTimeout(r, 1000 * attempt));
      }
    }
  }
}

async function uploadOneFile(file, rowEl, model, contentType, niche, vaName, dateStrRef) {
  const bar = rowEl.querySelector(".bar-track");
  const fill = rowEl.querySelector(".bar-fill");
  const barLabel = rowEl.querySelector(".bar-label");
  bar.style.display = "block";
  barLabel.style.display = "block";

  const initResp = await fetch("/api/va-upload/init", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model, content_type: contentType, file_name: file.name,
      mime_type: file.type || "application/octet-stream",
      date_str: dateStrRef.value,
    }),
  });
  if (!initResp.ok) throw new Error("init failed: " + await initResp.text());
  const initData = await initResp.json();
  dateStrRef.value = initData.date_str;

  const result = await uploadResumable(initData.upload_url, file, (done, total) => {
    const pct = Math.round((done / total) * 100);
    fill.style.width = pct + "%";
    barLabel.textContent = `${pct}% (${(done / 1024 / 1024).toFixed(1)} / ${(total / 1024 / 1024).toFixed(1)} MB)`;
  });

  await fetch("/api/va-upload/file-done", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model, content_type: contentType, niche, va_name: vaName,
      file_name: file.name, mime_type: file.type || "application/octet-stream",
      drive_file_id: result ? result.id : null,
      date_str: dateStrRef.value,
    }),
  });
}

document.getElementById("submit").addEventListener("click", async () => {
  if (!validate()) return;
  submitBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Uploading...";

  const model = modelEl.value;
  const contentType = document.getElementById("content_type").value;
  const niche = currentNiche();
  const vaName = document.getElementById("va_name").value;

  try {
    for (let i = 0; i < selectedFiles.length; i++) {
      if (completedIndices.has(i)) continue; // already uploaded in a previous attempt
      const rowEl = fileListEl.querySelector(`.file-row[data-index="${i}"]`);
      await uploadOneFile(selectedFiles[i], rowEl, model, contentType, niche, vaName, dateStrRef);
      completedIndices.add(i);
    }
    await fetch("/api/va-upload/finalize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, content_type: contentType, date_str: dateStrRef.value }),
    });
    statusEl.className = "ok";
    statusEl.textContent = "✅ Done — all files uploaded.";
    selectedFiles = [];
    completedIndices = new Set();
    dateStrRef.value = null;
    renderFileList();
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = "❌ Error: " + err.message + "\nAlready-finished files above are marked ✅ and won't be re-sent — just click Upload again to retry the rest.";
    renderFileList();
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
